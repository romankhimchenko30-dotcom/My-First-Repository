name: Run My Code Robot lvl 3

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # позволяет запускать вручную кнопкой в Actions

jobs:
  # ===========================================================================================
  # Тест на разных версиях
  # ===========================================================================================
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'        
                             
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Run script
        env:
          MY_API_KEY: ${{ secrets.MY_API_KEY }}     
        run: python hello.py

      
      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-py${{ matrix.ptyhon-version }}
          path: report.txt
          if-no-files-found: warn

  # =============================================================================================================
  # Запуск после финальных тестов:
  # =============================================================================================================

  deploy:
    name: Final step (after tests)
    needs: test                       
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

        name: Say done
        run: echo "Все тесты прошли!"
